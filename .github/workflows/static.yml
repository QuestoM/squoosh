name: Deploy Squoosh to Pages

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.16.0'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build project
        run: npm run build
        
      - name: Debug - List build output
        run: |
          echo "Checking if build files exist:"
          find . -type d -name "static"
          find . -name "index.html"

      - name: Create public directory with build output
        run: |
          mkdir -p public
          if [ -d ".tmp/build/static" ]; then
            cp -r .tmp/build/static/* public/
            echo "Copied build files to public directory"
          else
            echo "Build directory not found! Creating error page."
            echo "<html><body><h1>Build Error</h1><p>Could not find build output.</p></body></html>" > public/index.html
          fi
          ls -la public
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
