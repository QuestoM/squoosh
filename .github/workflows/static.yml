# Workflow for deploying Squoosh to GitHub Pages
name: Deploy Squoosh to Pages

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.16.0'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build project
        run: npm run build
        
      - name: Debug - List directories
        run: |
          echo "Build output structure:"
          find .tmp -type f -name "index.html"
          ls -la .tmp/build
          
      - name: Create index.html in root if missing
        run: |
          if [ -f ".tmp/build/static/index.html" ]; then
            cp .tmp/build/static/index.html ./index.html
            echo "Copied index.html to root"
          else
            echo "<!DOCTYPE html><html><head><meta http-equiv='refresh' content='0;url=.tmp/build/static/index.html'></head></html>" > index.html
            echo "Created redirect index.html"
          fi
          
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
