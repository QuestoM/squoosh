name: Deploy Squoosh with Path Fixes

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.16.0'
      
      - name: Patch files for GitHub Pages
        run: |
          # 1. Update the base path in serve.json for redirects
          echo "Updating serve.json with base path"
          if [ -f "serve.json" ]; then
            sed -i 's|"source": "/editor"|"source": "/squoosh/editor"|g' serve.json
            sed -i 's|"destination": "/"|"destination": "/squoosh/"|g' serve.json
            cat serve.json
          fi
          
          # 2. Add base path to the router configuration
          echo "Patching client files for base path"
          # Update route in App/index.tsx to include /squoosh base path
          if [ -f "src/client/lazy-app/Compress/index.tsx" ]; then
            sed -i 's|ROUTE_EDITOR = \'/editor\'|ROUTE_EDITOR = \'/squoosh/editor\'|g' src/client/initial-app/App/index.tsx
            sed -i 's|history.pushState(null, \'\', editorURL.href)|history.pushState(null, \'\', editorURL.href.replace(\'/editor\', \'/squoosh/editor\'))|g' src/client/initial-app/App/index.tsx
          fi
          
          # 3. Add a fix for static assets to make sure icons and other resources load correctly
          # Create a patch file for rollup.config.js to update asset paths
          cat > rollup.patch.js << 'EOF'
          // Patch for rollup.config.js to fix asset paths for GitHub Pages
          function resolveFileUrlForGithubPages({ fileName }) {
            return JSON.stringify('/squoosh' + fileNameToURL(fileName));
          }
          EOF
          
          # 4. Create a .nojekyll file to ensure GitHub Pages doesn't process the files with Jekyll
          touch .nojekyll
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build project
        run: npm run build
        
      - name: Create custom deploy files
        run: |
          mkdir -p deploy
          
          # Copy build files
          if [ -d ".tmp/build/static" ]; then
            echo "Found build output - copying files"
            cp -r .tmp/build/static/* deploy/
            cp .nojekyll deploy/
            
            # Fix routing: Create a redirect at /editor to /squoosh/editor
            mkdir -p deploy/editor
            cat > deploy/editor/index.html << 'EOF'
<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="refresh" content="0;url=/squoosh/editor">
  <title>Redirecting...</title>
</head>
<body>
  Redirecting to <a href="/squoosh/editor">/squoosh/editor</a>...
</body>
</html>
EOF
            
            # Fix any internal links in the index.html
            if [ -f "deploy/index.html" ]; then
              echo "Fixing internal links in index.html"
              sed -i 's|href="/|href="/squoosh/|g' deploy/index.html
              sed -i 's|src="/|src="/squoosh/|g' deploy/index.html
              
              # Add a base tag to ensure all relative URLs resolve correctly
              sed -i 's|<head>|<head>\n  <base href="/squoosh/">|' deploy/index.html
            fi
            
            # Create a 404.html that redirects back to the main app for client-side routing
            cat > deploy/404.html << 'EOF'
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Squoosh</title>
  <script>
    // Redirect all 404s back to the main app with the path preserved
    // This handles client-side routing when users refresh on a route
    const path = window.location.pathname.replace(/^\/squoosh/, '');
    window.location.href = '/squoosh/#' + path;
  </script>
  <meta http-equiv="refresh" content="0;url=/squoosh/">
</head>
<body>
  Redirecting to <a href="/squoosh/">Squoosh app</a>...
</body>
</html>
EOF
          else
            echo "Build files not found. Creating error page."
            mkdir -p deploy
            cat > deploy/index.html << 'EOF'
<!DOCTYPE html>
<html>
<head>
  <title>Build Error</title>
</head>
<body>
  <h1>Build Error</h1>
  <p>Could not find build output.</p>
</body>
</html>
EOF
          fi
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'deploy'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
