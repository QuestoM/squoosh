name: Deploy Squoosh with Post-Build Fixes

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.16.0'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build project
        run: npm run build
        
      - name: Create deployment with redirects
        run: |
          mkdir -p deploy
          
          # Copy build files
          if [ -d ".tmp/build/static" ]; then
            echo "Found build output - copying files"
            cp -r .tmp/build/static/* deploy/
            
            # Create a main HTML page at root with client-side redirect script
            cat > deploy/index.html << 'EOF'
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Squoosh - Image Compression App</title>
  <script>
    // Intercept all navigation requests and handle GitHub Pages paths
    window.addEventListener('DOMContentLoaded', () => {
      // Patch the history API to prepend /squoosh to paths
      const originalPushState = history.pushState;
      history.pushState = function(state, title, url) {
        if (url && url.startsWith('/editor')) {
          console.log('Intercepted navigation to', url);
          url = '/squoosh' + url;
        }
        return originalPushState.call(this, state, title, url);
      };
      
      // Load the actual app
      const script = document.createElement('script');
      script.src = 'client-main.js';  // Replace with actual main JS file
      document.body.appendChild(script);
    });
  </script>
  <style>
    #app {
      height: 100vh;
      width: 100vw;
      position: relative;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- The app will render here -->
    <div style="display: flex; justify-content: center; align-items: center; height: 100vh;">
      <p>Loading Squoosh...</p>
    </div>
  </div>
  
  <!-- Find main JS file and include it -->
  <script>
    // Find the main JS file by pattern
    fetch('/squoosh/')
      .then(response => response.text())
      .then(html => {
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const scripts = Array.from(doc.querySelectorAll('script[src]'));
        scripts.forEach(script => {
          const newScript = document.createElement('script');
          newScript.src = script.getAttribute('src');
          document.body.appendChild(newScript);
        });
      });
  </script>
</body>
</html>
EOF

            # Copy original HTML and JS to maintain the original app code
            if [ -f ".tmp/build/static/index.html" ]; then
              cp .tmp/build/static/index.html deploy/original-index.html
            fi
            
            # Create editor redirect
            mkdir -p deploy/editor
            cat > deploy/editor/index.html << 'EOF'
<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="refresh" content="0;url=/squoosh/">
  <script>
    // Redirect with path preserved
    window.location.href = '/squoosh/';
  </script>
</head>
<body>
  <p>Redirecting to <a href="/squoosh/">Squoosh</a>...</p>
</body>
</html>
EOF

            # Create a custom 404 page that redirects back to the app
            cat > deploy/404.html << 'EOF'
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Squoosh</title>
  <script>
    // Send all navigation to the main app
    window.location.href = '/squoosh/';
  </script>
</head>
<body>
  <p>Redirecting to <a href="/squoosh/">Squoosh app</a>...</p>
</body>
</html>
EOF
          else
            echo "Build files not found. Creating error page."
            mkdir -p deploy
            cat > deploy/index.html << 'EOF'
<!DOCTYPE html>
<html>
<head>
  <title>Build Error</title>
</head>
<body>
  <h1>Build Error</h1>
  <p>Could not find build output.</p>
</body>
</html>
EOF
          fi
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'deploy'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
